<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-container">
        <h1>TODO List</h1>

        <div class="input-row">

        </div>

        <div>
            <ul id="todoList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
